[package]
name = "flash-tiering-module"
version = "0.2.0"
edition = "2021"
description = "Valkey flash-tiering storage module — pluggable backends with clean separation"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["backend-flashcache"]

# Backend selection
backend-rocksdb = ["dep:rocksdb"]
backend-flashcache = []   # FlashCache loaded via dlopen; no link-time dependency

# Use system allocator for unit tests (Valkey allocator unavailable outside server)
enable-system-alloc = ["valkey-module/enable-system-alloc"]

[dependencies]
crossbeam-queue = "0.3"
once_cell = "1"
thiserror = "1"
libc = "0.2"
rocksdb = { version = "0.22", features = ["multi-threaded-cf"], optional = true }
valkey-module = { path = "../valkeymodule-rs" }

[build-dependencies]
cc = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
