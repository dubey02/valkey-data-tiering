name: Data Tiering PR Benchmark

# Add the run-tiering-benchmark label to a PR to benchmark it against its base
# branch with the valkey-perf-benchmark Zipfian 80/20 tiering test. Each run
# launches its own EC2 instance and terminates it when done.

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to benchmark against its base. Overrides base_ref and pr_ref"
        required: false
      base_ref:
        description: "Base commit or branch, used when pr_number is empty"
        required: false
        default: data-tiering-unstable
      pr_ref:
        description: "Commit or branch to compare against the base, used when pr_number is empty"
        required: false
      comment_on:
        description: "PR or issue number to post the results on. Empty uses pr_number"
        required: false
      groups:
        description: "Test groups from configs/tiering.json to run, e.g. 1,4. Empty uses TIERING_BENCHMARK_GROUPS or 1 (Zipfian 80/20)"
        required: false
      instance_type:
        description: "EC2 instance type. Empty uses DT_INSTANCE_TYPE or r8gd.2xlarge"
        required: false
      aws_region:
        description: "AWS region. Empty uses DT_AWS_REGION or us-west-2. DT_SUBNET_ID must be in this region"
        required: false
      perf_benchmark_repo:
        description: "valkey-perf-benchmark repo. Empty uses PERF_BENCHMARK_REPO or valkey-io/valkey-perf-benchmark"
        required: false
      perf_benchmark_ref:
        description: "valkey-perf-benchmark branch or commit. Empty uses PERF_BENCHMARK_REF or main"
        required: false

concurrency:
  group: tiering-pr-benchmark-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: "bash -Eeuo pipefail {0}"

permissions:
  contents: read

env:
  AWS_REGION: ${{ inputs.aws_region || vars.DT_AWS_REGION || 'us-west-2' }}
  INSTANCE_TYPE: ${{ inputs.instance_type || vars.DT_INSTANCE_TYPE || 'r8gd.2xlarge' }}
  VALKEY_REPO: ${{ vars.DT_VALKEY_REPO || github.repository }}
  PERF_BENCHMARK_REPO: ${{ inputs.perf_benchmark_repo || vars.PERF_BENCHMARK_REPO || 'valkey-io/valkey-perf-benchmark' }}
  PERF_BENCHMARK_REF: ${{ inputs.perf_benchmark_ref || vars.PERF_BENCHMARK_REF || 'main' }}

jobs:
  start-runner:
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'run-tiering-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    outputs:
      label: ${{ steps.runner.outputs.label }}
      instance-id: ${{ steps.runner.outputs.ec2-instance-id }}
      public-ip: ${{ steps.ingress.outputs.public-ip }}
      security-group-id: ${{ steps.sg.outputs.security-group-id }}
      base-sha: ${{ steps.refs.outputs.base-sha }}
      pr-sha: ${{ steps.refs.outputs.pr-sha }}
      head-sha: ${{ steps.refs.outputs.head-sha }}
      comment-number: ${{ steps.refs.outputs.comment-number }}
      pr-number: ${{ steps.refs.outputs.pr-number }}
    steps:
      - name: Resolve commits
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          IN_PR_NUMBER: ${{ inputs.pr_number }}
          IN_COMMENT_ON: ${{ inputs.comment_on }}
          IN_BASE: ${{ inputs.base_ref }}
          IN_PR: ${{ inputs.pr_ref }}
        run: |
          NUMBER=${EVENT_PR:-$IN_PR_NUMBER}
          COMMENT_ON=${IN_COMMENT_ON:-$NUMBER}
          if [[ -n "$COMMENT_ON" && ! "$COMMENT_ON" =~ ^[0-9]+$ ]]; then
            echo "::error::comment_on must be a PR or issue number"
            exit 1
          fi
          if [[ -n "$NUMBER" ]]; then
            PULL=$(gh api "repos/$VALKEY_REPO/pulls/$NUMBER")
            PR=$(jq -r .merge_commit_sha <<< "$PULL")
            HEAD=$(jq -r .head.sha <<< "$PULL")
            [[ "$PR" != null && -n "$PR" ]] || { echo "::error::PR #$NUMBER has no merge commit (conflicts?)"; exit 1; }
            BASE=$(gh api "repos/$VALKEY_REPO/commits/$PR" --jq '.parents[0].sha')
          else
            [[ -n "$IN_PR" ]] || { echo "::error::set pr_number, or pr_ref"; exit 1; }
            BASE=$(gh api "repos/$VALKEY_REPO/commits/${IN_BASE:-data-tiering-unstable}" --jq .sha)
            PR=$(gh api "repos/$VALKEY_REPO/commits/$IN_PR" --jq .sha)
            HEAD=$PR
          fi
          {
            echo "base-sha=$BASE"
            echo "pr-sha=$PR"
            echo "head-sha=$HEAD"
            echo "comment-number=$COMMENT_ON"
            echo "pr-number=$NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "pr #${NUMBER:-none}, comment on #${COMMENT_ON:-none}, base $BASE, pr $PR, $INSTANCE_TYPE in $AWS_REGION, $PERF_BENCHMARK_REPO@$PERF_BENCHMARK_REF"

      - name: Comment that the benchmark started
        if: steps.refs.outputs.comment-number != '' && env.VALKEY_REPO == github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COMMENT_ON: ${{ steps.refs.outputs.comment-number }}
          PR_NUMBER: ${{ steps.refs.outputs.pr-number }}
          BASE: ${{ steps.refs.outputs.base-sha }}
          HEAD: ${{ steps.refs.outputs.head-sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const link = (sha) => `[\`${sha.slice(0, 7)}\`](https://github.com/${owner}/${repo}/commit/${sha})`;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const {PR_NUMBER, BASE, HEAD} = process.env;
            const what = PR_NUMBER
              ? `PR #${PR_NUMBER} merged onto base ${link(BASE)} (PR head ${link(HEAD)})`
              : `${link(HEAD)} compared with base ${link(BASE)}`;
            await github.rest.issues.createComment({
              issue_number: Number(process.env.COMMENT_ON),
              owner,
              repo,
              body: `**Data tiering benchmark started:** ${what} on \`${process.env.INSTANCE_TYPE}\`. [Follow the run](${run})`
            });

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DT_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create a security group for this run
        id: sg
        env:
          SUBNET_ID: ${{ secrets.DT_SUBNET_ID }}
        run: |
          VPC=$(aws ec2 describe-subnets --subnet-ids "$SUBNET_ID" \
            --query 'Subnets[0].VpcId' --output text)
          NAME="dt-pr-benchmark-${{ github.run_id }}-${{ github.run_attempt }}"
          SG=$(aws ec2 create-security-group --group-name "$NAME" --vpc-id "$VPC" \
            --description "Data tiering PR benchmark run ${{ github.run_id }}, self access only" \
            --tag-specifications "ResourceType=security-group,Tags=[{Key=Name,Value=$NAME},{Key=purpose,Value=dt-pr-benchmark}]" \
            --query GroupId --output text)
          echo "security-group-id=$SG" >> "$GITHUB_OUTPUT"
          echo "created $SG in $VPC"

      - name: Resolve the AMI
        id: ami
        run: |
          AMI=$(aws ssm get-parameter \
            --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64 \
            --query Parameter.Value --output text)
          echo "ami=$AMI" >> "$GITHUB_OUTPUT"

      - name: Create a GitHub App token for runner registration
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DT_RUNNER_APP_ID }}
          private-key: ${{ secrets.DT_RUNNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      - name: Start the EC2 runner
        id: runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.app.outputs.token }}
          use-jit: true
          ec2-image-id: ${{ steps.ami.outputs.ami }}
          ec2-instance-type: ${{ env.INSTANCE_TYPE }}
          subnet-id: ${{ secrets.DT_SUBNET_ID }}
          security-group-id: ${{ steps.sg.outputs.security-group-id }}
          iam-role-name: ${{ secrets.DT_INSTANCE_PROFILE }}
          run-runner-as-user: ec2-user
          startup-timeout-minutes: 15
          metadata-options: '{"HttpTokens": "required"}'
          block-device-mappings: '[{"DeviceName": "/dev/xvda", "Ebs": {"VolumeSize": 64, "VolumeType": "gp3", "DeleteOnTermination": true}}]'
          aws-resource-tags: '[{"Key": "Name", "Value": "dt-pr-benchmark-${{ github.run_id }}"}, {"Key": "purpose", "Value": "dt-pr-benchmark"}]'
          pre-runner-script: |
            shutdown -h +240
            dnf install -y -q git gcc gcc-c++ make cmake tcl libaio-devel openssl-devel \
              python3.11 python3.11-pip libicu jq sysstat numactl perf
            NODES=$(ls -d /sys/devices/system/node/node[0-9]* | wc -l)
            for d in /sys/block/nvme*n1; do
              grep -q "Instance Storage" "$d/device/model" || continue
              node=$(cat "$d/device/numa_node")
              if [ "$node" = 0 ] || { [ "$NODES" = 1 ] && [ "$node" = -1 ]; }; then
                DEV=/dev/$(basename "$d")
                break
              fi
            done
            mkfs.ext4 -q -F "$DEV"
            mkdir -p /mnt/nvme
            mount -o noatime "$DEV" /mnt/nvme
            chown ec2-user:ec2-user /mnt/nvme

      - name: Allow the instance to reach itself on its public IP
        id: ingress
        env:
          IID: ${{ steps.runner.outputs.ec2-instance-id }}
          SG: ${{ steps.sg.outputs.security-group-id }}
        run: |
          IP=$(aws ec2 describe-instances --instance-ids "$IID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          [[ "$IP" != None && -n "$IP" ]] || { echo "::error::instance $IID has no public IP"; exit 1; }
          aws ec2 authorize-security-group-ingress --group-id "$SG" --ip-permissions \
            "[{\"IpProtocol\":\"tcp\",\"FromPort\":6379,\"ToPort\":6379,\"IpRanges\":[{\"CidrIp\":\"$IP/32\"}]}]" > /dev/null
          echo "public-ip=$IP" >> "$GITHUB_OUTPUT"
          echo "$SG allows tcp 6379 from $IP/32"

  benchmark:
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      NUM_RUNS: ${{ vars.TIERING_BENCHMARK_RUNS || '3' }}
      TIERING_GROUPS: ${{ inputs.groups || vars.TIERING_BENCHMARK_GROUPS || '1' }}
      BASE_SHA: ${{ needs.start-runner.outputs.base-sha }}
      PR_SHA: ${{ needs.start-runner.outputs.pr-sha }}
      EXPECTED_IP: ${{ needs.start-runner.outputs.public-ip }}
    steps:
      - name: Checkout valkey-data-tiering
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.VALKEY_REPO }}
          path: valkey
          fetch-depth: 0
          ref: ${{ env.PR_SHA }}
          persist-credentials: false

      - name: Checkout data-tiering-unstable for valkey-benchmark
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.VALKEY_REPO }}
          path: valkey_bench
          fetch-depth: 1
          ref: data-tiering-unstable
          persist-credentials: false

      - name: Checkout valkey-perf-benchmark
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.PERF_BENCHMARK_REPO }}
          ref: ${{ env.PERF_BENCHMARK_REF }}
          path: valkey-perf-benchmark
          fetch-depth: 1
          persist-credentials: false

      - name: Install Python dependencies
        working-directory: valkey-perf-benchmark
        run: |
          python3.11 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build valkey-benchmark from data-tiering-unstable
        working-directory: valkey_bench
        run: |
          make -j"$(nproc)"
          if ! ./src/valkey-benchmark --help 2>&1 | grep -q -- "--keysize"; then
            echo "::error::valkey-benchmark on data-tiering-unstable has no --keysize, which the tiering config needs"
            exit 1
          fi
          echo "VALKEY_BENCHMARK_PATH=$(pwd)/src/valkey-benchmark" >> "$GITHUB_ENV"

      - name: Resolve the public IP and fit the CPU layout to this machine
        working-directory: valkey-perf-benchmark
        run: |
          for _ in $(seq 1 24); do
            TOK=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            TARGET_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOK" http://169.254.169.254/latest/meta-data/public-ipv4)
            [[ "$TARGET_IP" == "$EXPECTED_IP" ]] && break
            sleep 5
          done
          [[ "$TARGET_IP" == "$EXPECTED_IP" ]] || { echo "::error::public IP is $TARGET_IP, expected $EXPECTED_IP"; exit 1; }
          echo "TARGET_IP=$TARGET_IP" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          cfg = json.load(open("configs/tiering.json"))
          n = os.cpu_count()
          for c in cfg:
              alloc = c.get("cpu_allocation", {})
              need = alloc.get("cores_per_server", 0) + 2 * alloc.get("cores_per_client", 0)
              if alloc and need > n:
                  server = max(2, n // 4)
                  per_client = (n - server) // 2
                  c["cpu_allocation"] = {
                      "cores_per_server": server,
                      "cores_per_client": per_client,
                      "servers": [f"0-{server - 1}"],
                      "clients": [f"{server}-{server + 2 * per_client - 1}"],
                  }
              print("cpu_allocation", c.get("cpu_allocation"))
          json.dump(cfg, open("../tiering.json", "w"), indent=2)
          PY
          echo "target $TARGET_IP, $(nproc) cores"

      - name: Run base benchmark
        working-directory: valkey-perf-benchmark
        run: |
          git -C ../valkey checkout --detach "$BASE_SHA"
          python ./benchmark.py \
            --config ../tiering.json \
            --commits "$BASE_SHA" \
            --valkey-path ../valkey \
            --valkey-benchmark-path "$VALKEY_BENCHMARK_PATH" \
            --target-ip "$TARGET_IP" \
            --results-dir results \
            --groups "$TIERING_GROUPS" \
            --runs "$NUM_RUNS"
          test "$(git -C ../valkey rev-parse HEAD)" = "$BASE_SHA"

      - name: Run PR benchmark
        working-directory: valkey-perf-benchmark
        run: |
          git -C ../valkey checkout --detach "$PR_SHA"
          python ./benchmark.py \
            --config ../tiering.json \
            --commits "$PR_SHA" \
            --valkey-path ../valkey \
            --valkey-benchmark-path "$VALKEY_BENCHMARK_PATH" \
            --target-ip "$TARGET_IP" \
            --results-dir results \
            --groups "$TIERING_GROUPS" \
            --runs "$NUM_RUNS"
          test "$(git -C ../valkey rev-parse HEAD)" = "$PR_SHA"

      - name: Compare results
        working-directory: valkey-perf-benchmark
        run: |
          python ./utils/compare_benchmark_results.py \
            --baseline "./results/$BASE_SHA/metrics.json" \
            --new "./results/$PR_SHA/metrics.json" \
            --output ../comparison.md
          cat ../comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tiering-benchmark-results
          path: |
            ./valkey-perf-benchmark/results/
            comparison.md

  report:
    needs: [start-runner, benchmark]
    if: >-
      always() && needs.start-runner.result != 'skipped' &&
      needs.start-runner.outputs.comment-number != '' && (vars.DT_VALKEY_REPO || github.repository) == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Download results
        if: needs.benchmark.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tiering-benchmark-results

      - name: Comment results
        if: needs.benchmark.result == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comparison.md', 'utf8');
            const {owner, repo} = context.repo;
            const link = (sha) => `[\`${sha.slice(0, 7)}\`](https://github.com/${owner}/${repo}/commit/${sha})`;
            const base = '${{ needs.start-runner.outputs.base-sha }}';
            const head = '${{ needs.start-runner.outputs.head-sha }}';
            const pr = '${{ needs.start-runner.outputs.pr-number }}';
            const what = pr
              ? `PR #${pr} merged onto base ${link(base)} (PR head ${link(head)})`
              : `${link(head)} compared with base ${link(base)}`;
            await github.rest.issues.createComment({
              issue_number: Number('${{ needs.start-runner.outputs.comment-number }}'),
              owner,
              repo,
              body: `**Data tiering benchmark:** ${what}\n\n${body}`
            });

      - name: Comment that the benchmark failed
        if: needs.benchmark.result != 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESULT: ${{ needs.benchmark.result == 'skipped' && needs.start-runner.result || needs.benchmark.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              issue_number: Number('${{ needs.start-runner.outputs.comment-number }}'),
              owner,
              repo,
              body: `**Data tiering benchmark ${process.env.RESULT}.** No results were posted. [See the run](${run})`
            });

      - name: Remove run-tiering-benchmark label
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'run-tiering-benchmark'
            }).catch(err => console.log('label not present', err.message));

  stop-runner:
    needs: [start-runner, benchmark]
    if: always() && needs.start-runner.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DT_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create a GitHub App token for runner registration
        id: app
        if: needs.start-runner.outputs.instance-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DT_RUNNER_APP_ID }}
          private-key: ${{ secrets.DT_RUNNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      - name: Stop the EC2 runner
        if: needs.start-runner.outputs.instance-id != ''
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.app.outputs.token }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.instance-id }}

      - name: Delete the run's security group
        if: needs.start-runner.outputs.security-group-id != ''
        env:
          IID: ${{ needs.start-runner.outputs.instance-id }}
          SG: ${{ needs.start-runner.outputs.security-group-id }}
        run: |
          if [[ -n "$IID" ]]; then
            aws ec2 wait instance-terminated --instance-ids "$IID"
          fi
          for _ in $(seq 1 12); do
            if aws ec2 delete-security-group --group-id "$SG"; then
              echo "deleted $SG"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::could not delete $SG"
