name: Ext storage NVMe tests

# Runs the FlashCache fuzz test, which ci.yml skips, on an on-demand EC2
# instance with /tmp on local NVMe. Runs on every push to
# data-tiering-unstable and on every PR. PR runs start only when the person who
# opened, pushed to or labeled the PR has write access; for anyone else, a
# maintainer adds the run-nvme-tests label.

on:
  push:
    branches: [data-tiering-unstable]
    paths-ignore:
      - '**/*.md'
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to test"
        required: false
        default: data-tiering-unstable
      instance_type:
        description: "EC2 instance type. Empty uses DT_NVME_INSTANCE_TYPE or m6gd.xlarge"
        required: false

concurrency:
  group: ext-storage-nvme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: "bash -Eeuo pipefail {0}"

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-nvme-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.access.outputs.run }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      # PR code runs on the instance, so a PR from someone without write access
      # is skipped, not failed, until a maintainer labels it.
      - name: Check that the actor has write access
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$PERMISSION" in
            admin|write) echo "$ACTOR has $PERMISSION access"; echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::notice::$ACTOR has $PERMISSION access, add the run-nvme-tests label to run these tests"; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Resolve the commit
        id: ref
        if: steps.access.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          IN_REF: ${{ inputs.ref }}
        run: |
          case "$EVENT" in
            pull_request_target) SHA=$PR_HEAD ;;
            workflow_dispatch) SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/${IN_REF:-data-tiering-unstable}" --jq .sha) ;;
            *) SHA=$GITHUB_SHA ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "testing $SHA"

  start-runner:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    uses: ./.github/workflows/ec2-runner.yml
    permissions:
      contents: read
      id-token: write
    with:
      mode: start
      instance_type: ${{ inputs.instance_type || vars.DT_NVME_INSTANCE_TYPE || 'm6gd.xlarge' }}
      max_lifetime_minutes: 180
      # The tests create their files under /tmp, which is tmpfs on AL2023.
      pre_runner_script: |
        dnf install -y -q git gcc gcc-c++ make cmake python3 libaio-devel gtest-devel gmock-devel
        mkdir -p /mnt/nvme/tmp
        chmod 1777 /mnt/nvme/tmp
        mount --bind /mnt/nvme/tmp /tmp
    secrets: inherit

  test:
    needs: [prepare, start-runner]
    runs-on: ${{ needs.start-runner.outputs.label }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: test-storage-fuzz
        run: make test-storage UNIT_TEST_PATTERN=FlashcacheFuzzTest.

  stop-runner:
    needs: [start-runner, test]
    if: always() && needs.start-runner.result != 'skipped'
    uses: ./.github/workflows/ec2-runner.yml
    permissions:
      contents: read
      id-token: write
    with:
      mode: stop
      label: ${{ needs.start-runner.outputs.label }}
      instance_id: ${{ needs.start-runner.outputs.instance-id }}
      security_group_id: ${{ needs.start-runner.outputs.security-group-id }}
    secrets: inherit
