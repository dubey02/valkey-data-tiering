<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valkey Data Tiering - How It Works</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --card:#1d2740; --border:#2a3550; --text:#dce3f2;
          --muted:#8593ad; --accent:#4da3ff; --ok:#3ecf8e; --warn:#f5b950; --hot:#ff6b6b; --purple:#c586f0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; padding:22px; }
  h1 { font-size:20px; margin-bottom:2px; }
  .sub { color:var(--muted); margin-bottom:14px; font-size:13px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:7px 15px;
           border-radius:8px; cursor:pointer; font-size:13.5px; }
  button:hover { border-color:var(--accent); }
  button.active { background:var(--accent); color:#08101f; border-color:var(--accent); font-weight:600; }
  .stepctl { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .stepctl .count { color:var(--muted); font-size:12.5px; min-width:58px; text-align:center; }
  .layout { display:grid; grid-template-columns:minmax(500px,1fr) 440px; align-items:start; gap:16px; align-items:start; max-width:1280px; }
  @media (max-width:1080px){ .layout{ grid-template-columns:1fr; } }
  svg { width:100%; background:var(--panel); border:1px solid var(--border); border-radius:12px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .panel h3 { font-size:12.5px; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
  #detail { font-size:13.5px; }
  #detail code { background:#0c1220; padding:1px 5px; border-radius:4px; font-size:12px; color:var(--warn); }
  #detail p + p, #detail table { margin-top:9px; }
  #detail table { width:100%; border-collapse:collapse; font-size:12.5px; }
  #detail td, #detail th { border:1px solid var(--border); padding:4px 8px; text-align:left; }
  #detail th { color:var(--muted); font-weight:600; }
  #detail .ok { color:var(--ok); } #detail .hot { color:var(--hot); } #detail .wa { color:var(--warn); }
  .hint { margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); }
  /* SVG shared */
  .node { rx:11; cursor:pointer; transition:all .25s; }
  .node:hover { stroke:var(--accent); }
  .node.sel { stroke:var(--accent); stroke-width:3.5; fill:#22324f; }
  .node.lit { stroke:var(--warn); stroke-width:3.5; fill:#2a2a1f; }
  .node.ok-lit { stroke:var(--ok); stroke-width:3.5; fill:#1c3a30; }
  .nlabel { fill:var(--text); font-size:12.5px; font-weight:700; pointer-events:none; }
  .nsub { fill:var(--muted); font-size:10px; pointer-events:none; }
  .edge { stroke:var(--border); stroke-width:2; fill:none; marker-end:url(#arr); transition:all .25s; }
  .edge.hi { stroke:var(--accent); stroke-width:3; marker-end:url(#arrB); }
  .edge.hi-in { stroke:var(--ok); stroke-width:3; marker-end:url(#arrG); }
  .elabel { fill:var(--muted); font-size:10.5px; font-family:ui-monospace,Menlo,monospace; transition:all .25s; }
  .elabel.hi { fill:var(--accent); font-weight:700; }
  .elabel.hi-in { fill:var(--ok); font-weight:700; }
  .dim { opacity:.22; }
  .stage { fill:#1d2740; stroke:var(--border); stroke-width:1.6; rx:10; transition:all .3s; }
  .stage.lit { stroke:var(--accent); stroke-width:3; fill:#22324f; }
  .stage.io { }
  .stage.io.lit { stroke:var(--hot); fill:#3a2230; }
  .slabel { fill:var(--text); font-size:12px; font-weight:700; }
  .ssub { fill:var(--muted); font-size:10px; }
  .chip { fill:#0c1220; stroke:var(--warn); stroke-width:1.5; rx:12; }
  .chiptext { fill:var(--warn); font-size:12px; font-weight:700; font-family:ui-monospace,Menlo,monospace; }
  .zone { transition:all .3s; }
  .marker { transition:all .5s; }

  /* ---------- HTML card pipeline (write/read paths) ---------- */
  .pipeline { display:flex; flex-direction:column; align-items:center; width:100%;
              padding:12px 0; }
  .pipe-card { width:100%; background:var(--card); border:2px solid var(--accent); border-radius:14px;
               padding:14px 18px; position:relative; cursor:pointer; transition:all .2s;
               box-shadow:0 3px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.03); }
  .pipe-card:hover { box-shadow:0 6px 24px rgba(77,163,255,.3); transform:translateY(-1px); }
  .pipe-card.io { border-color:var(--hot); }
  .pipe-card.io:hover { box-shadow:0 6px 24px rgba(255,107,107,.25); }
  .pipe-card.active { background:#1c2e4f; box-shadow:0 6px 24px rgba(77,163,255,.4); transform:translateY(-1px); }
  .pipe-card.io.active { background:#2e1a2a; box-shadow:0 6px 24px rgba(255,107,107,.35); }
  .pipe-card .pc-title { font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:10px; }
  .pipe-card .pc-title .tag { font-size:9.5px; letter-spacing:1.2px; font-weight:700;
                               background:#0c1220; border:1px solid var(--border); border-radius:5px;
                               padding:2px 8px; color:var(--accent); }
  .pipe-card.io .pc-title .tag { color:var(--hot); border-color:#4a2030; }
  .pipe-card .pc-sub { color:var(--muted); font-size:12.5px; margin-top:4px; }
  .pipe-card .pc-file { font:11px ui-monospace,Menlo,monospace; color:#5a7090; margin-top:6px; }
  .pipe-card .pc-pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .pipe-card .pill { font:11.5px ui-monospace,Menlo,monospace; background:#0c1220; border:1px solid #3a4a6a;
                     border-radius:14px; padding:3px 11px; color:#c9d6ee; white-space:nowrap; }
  .pipe-card .pill.hi { border-color:var(--warn); color:var(--warn); }
  .pipe-card .pill.ret { border-color:var(--ok); color:var(--ok); }
  .pipe-card::after { content:'view source'; position:absolute; top:12px; right:14px; font-size:9.5px;
                      color:var(--muted); letter-spacing:.8px; opacity:.6; }
  .pipe-conn { display:flex; flex-direction:column; align-items:center; padding:4px 0; }
  .pipe-conn .conn-line { width:3px; height:22px; background:var(--accent); border-radius:2px; opacity:.8; }
  .pipe-conn .conn-arrow { width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent;
                            border-top:11px solid var(--accent); opacity:.8; }
  .pipe-card.io ~ .pipe-conn .conn-line, .pipe-card.io ~ .pipe-conn .conn-arrow { background:var(--hot); border-top-color:var(--hot); }
  .pipe-conn .conn-label { font-size:10.5px; color:var(--accent); font-family:ui-monospace,Menlo,monospace;
                            background:#111827; border:1px solid #3a4a6a; border-radius:10px;
                            padding:2px 12px; margin:3px 0; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .pipe-state { display:inline-flex; align-items:center; gap:6px; font:12px ui-monospace,Menlo,monospace;
                background:#0c1220; border:1px solid var(--warn); border-radius:16px; padding:3px 12px;
                color:var(--warn); margin:6px 0; }

  /* ---------- Code syntax highlighting (modals + inline) ---------- */
  #mcode .cm, .panel .cm { color:#6a9955; }
  #mcode .kw, .panel .kw { color:#c586c0; }
  #mcode .fn, .panel .fn { color:#dcdcaa; }
  #mcode .ty, .panel .ty { color:#4ec9b0; }
  #mcode .hl, .panel .hl { color:#f5b950; font-weight:700; }

  .pipe-state.changed { animation: stateFlash 0.6s ease; }
  @keyframes stateFlash {
    0% { transform:scale(1); box-shadow:none; }
    50% { transform:scale(1.15); box-shadow:0 0 16px rgba(245,185,80,.5); }
    100% { transform:scale(1); box-shadow:none; }
  }

  /* ---------- FlashCache block diagram ---------- */
  .fc-arch { margin-bottom:18px; padding:16px; background:var(--panel); border:1px solid var(--border); border-radius:14px; }
  .fc-arch-title { font-size:11px; color:var(--muted); font-weight:700; letter-spacing:1.5px; margin-bottom:12px; }
  .fc-block { display:flex; flex-direction:column; gap:0; }
  .fc-layer { border:2px solid var(--border); border-radius:10px; padding:12px 16px; position:relative; }
  .fc-layer + .fc-layer { margin-top:10px; }
  .fc-layer.engine-l { border-color:var(--accent); }
  .fc-layer.dram-l { border-color:var(--ok); }
  .fc-layer.nvme-l { border-color:var(--hot); }
  .fc-layer-tag { position:absolute; top:-9px; left:16px; background:var(--panel); padding:0 8px;
                  font-size:9.5px; font-weight:700; letter-spacing:1.2px; color:var(--muted); }
  .fc-layer.engine-l .fc-layer-tag { color:var(--accent); }
  .fc-layer.dram-l .fc-layer-tag { color:var(--ok); }
  .fc-layer.nvme-l .fc-layer-tag { color:var(--hot); }
  .fc-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .fc-comp { background:var(--card); border:1.5px solid var(--border); border-radius:8px;
             padding:6px 12px; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .fc-comp small { display:block; font-weight:400; font-size:10.5px; color:var(--muted); }
  .fc-arrow { display:flex; flex-direction:column; align-items:center; padding:4px 0; }
  .fc-arrow .fa-line { width:3px; height:14px; background:var(--accent); border-radius:2px; opacity:.7; }
  .fc-arrow .fa-head { width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent;
                        border-top:8px solid var(--accent); opacity:.7; }
  .fc-arrow.up .fa-head { border-top:none; border-bottom:8px solid var(--ok); }
  .fc-arrow.up .fa-line { background:var(--ok); }
  .fc-flow-label { font-size:10px; color:var(--accent); font-family:ui-monospace,Menlo,monospace;
                   text-align:center; padding:2px 0; }

  /* ---------- Sub-tabs (within FlashCache) ---------- */
  .subtabs { display:flex; gap:6px; margin:14px 0 10px; }
  .subtabs button { background:var(--card); color:var(--muted); border:1.5px solid var(--border);
                    padding:5px 14px; border-radius:8px; font-size:12.5px; cursor:pointer; }
  .subtabs button:hover { border-color:var(--accent); color:var(--text); }
  .subtabs button.active { background:var(--accent); color:#08101f; border-color:var(--accent); font-weight:600; }


  /* ---------- Overview spatial diagram ---------- */
  .ov-diagram { padding:16px; display:grid; grid-template-columns:1fr; gap:12px; }
  .ov-box { border:2.5px solid var(--border); border-radius:14px; padding:16px; position:relative; background:rgba(23,30,46,.5); }
  .ov-box-tag { position:absolute; top:-10px; left:14px; background:var(--bg); padding:0 8px;
                font-size:10px; font-weight:700; letter-spacing:1.3px; }
  .ov-box.client { border-color:#8593ad; min-width:100px; max-width:130px; align-self:center; }
  .ov-box.client .ov-box-tag { color:#8593ad; }
  .ov-box.main { border-color:var(--accent); flex:1; min-width:240px; max-width:300px; }
  .ov-box.main .ov-box-tag { color:var(--accent); }
  .ov-box.iot { border-color:var(--hot); flex:1; min-width:200px; max-width:260px; }
  .ov-box.iot .ov-box-tag { color:var(--hot); }
  .ov-box.disk { border-color:var(--warn); min-width:100px; max-width:130px; align-self:center; }
  .ov-box.disk .ov-box-tag { color:var(--warn); }
  .ov-inner { background:var(--card); border:1.5px solid var(--border); border-radius:8px;
              padding:8px 12px; margin:6px 0; font-size:12.5px; font-weight:600; }
  .ov-inner small { display:block; font-weight:400; font-size:11px; color:var(--muted); margin-top:2px; }
  .ov-inner.hi { border-color:var(--accent); }
  .ov-inner.hi-r { border-color:var(--hot); }
  .ov-inner.hi-g { border-color:var(--ok); }
  .ov-conn { display:flex; flex-direction:column; align-items:center; justify-content:center; align-self:center; min-width:44px; flex-shrink:0; }
  .ov-conn .ov-c-line { width:40px; height:3px; background:var(--accent); border-radius:2px; opacity:.7; }
  .ov-conn .ov-c-head { width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent;
                         border-left:8px solid var(--accent); opacity:.7; }
  .ov-conn .ov-c-lbl { font-size:9.5px; color:var(--accent); font-family:ui-monospace,Menlo,monospace;
                        text-align:center; max-width:80px; margin-top:4px; }
  .ov-conn.red .ov-c-line { background:var(--hot); }
  .ov-conn.red .ov-c-head { border-left-color:var(--hot); }
  .ov-conn.red .ov-c-lbl { color:var(--hot); }
  .ov-conn.gold .ov-c-line { background:var(--warn); }
  .ov-conn.gold .ov-c-head { border-left-color:var(--warn); }
  .ov-conn.gold .ov-c-lbl { color:var(--warn); }

  .ov-boxes-row { display:grid; grid-template-columns: 110px 44px 1fr 90px 1fr 44px 110px; gap:0; align-items:center; }
  .layout.full-width { grid-template-columns:1fr !important; }

  .ov-queue { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-width:80px; }
  .ov-q-box { background:#0c1220; border:1.5px solid var(--border); border-radius:6px; padding:4px 8px;
              font-size:10px; font-family:ui-monospace,Menlo,monospace; text-align:center; white-space:nowrap; }
  .ov-q-box.down { border-color:var(--hot); color:var(--hot); }
  .ov-q-box.up { border-color:var(--ok); color:var(--ok); }
  .ov-q-arrow { font-size:14px; line-height:1; }
  .ov-q-arrow.down { color:var(--hot); }
  .ov-q-arrow.up { color:var(--ok); }
  .ov-q-label { font-size:9px; color:var(--muted); text-align:center; }

  
</style>
<style>
/* ===== Storage Interfaces tab (ported from dt-interfaces-compare.html) ===== */

#ifc-root .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }

    padding:7px 16px; border-radius:8px; cursor:pointer; font-size:13.5px; }
#ifc-root .controls button:hover { border-color:var(--accent); }
#ifc-root .controls button.active { background:var(--accent); color:#08101f; border-color:var(--accent); font-weight:600; }

#ifc-root /* ---------- diagram ---------- */
  .diagram { display:flex; flex-direction:column; align-items:center; }
#ifc-root .card { background:var(--card); border:1.5px solid var(--border); border-radius:14px;
          padding:14px 18px; width:100%; transition:all .3s; position:relative; }

#ifc-root .tag { font-size:9.5px; letter-spacing:1.4px; color:var(--muted); font-weight:700;
         background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:1px 7px; }
#ifc-root .apis { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; }
#ifc-root .apis .grp { font-size:10px; color:var(--muted); letter-spacing:.8px; font-weight:700; margin-right:2px; }
#ifc-root .pill { font:11.5px ui-monospace,Menlo,monospace; background:#0c1220; border:1px solid var(--border);
          border-radius:14px; padding:2.5px 11px; color:#c9d6ee; white-space:nowrap; }
#ifc-root .pill.hi { border-color:var(--warn); color:var(--warn); }
#ifc-root .pill.hi-b { border-color:var(--accent); color:var(--accent); }
#ifc-root .pill.hi-p { border-color:var(--purple); color:var(--purple); }
#ifc-root .note-badge { margin-top:10px; font-size:11.5px; color:var(--warn); background:#221c10;
                border:1px solid #4a3d1e; border-radius:8px; padding:5px 10px; display:inline-block; }
#ifc-root .card.engine { border-color:var(--accent); }
#ifc-root .card.contract { border-color:var(--warn); background:#1c2536; }
#ifc-root .card.native.on { border-color:var(--ok); }
#ifc-root .card.modapi { border-color:var(--purple); background:#221b30; }
#ifc-root .card.module.on { border-color:var(--purple); }
#ifc-root .dimmed { opacity:.25; }
#ifc-root /* ---------- connectors ---------- */
  .conn { display:flex; flex-direction:column; align-items:center; padding:2px 0; transition:opacity .3s; }
#ifc-root .conn .line { width:0; border-left:3px solid var(--accent); height:34px; }
#ifc-root .conn .line.dashed { border-left-style:dashed; }
#ifc-root .conn .line.g { border-left-color:var(--ok); }
#ifc-root .conn .line.p { border-left-color:var(--purple); }
#ifc-root .conn .head { width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent;
                border-top:9px solid var(--accent); }
#ifc-root .conn .head.g { border-top-color:var(--ok); }
#ifc-root .conn .head.p { border-top-color:var(--purple); }
#ifc-root .conn .head.up { border-top:none; border-bottom:9px solid var(--purple); order:-1; }
#ifc-root .conn .clabel { font:11px ui-monospace,Menlo,monospace; color:var(--accent); background:var(--panel);
                  border:1px solid var(--border); border-radius:6px; padding:2px 10px; margin:4px 0; }
#ifc-root .conn .clabel.g { color:var(--ok); }
#ifc-root .conn .clabel.p { color:var(--purple); }
#ifc-root .split { display:grid; grid-template-columns:1fr 1fr; gap:22px; width:100%; }
#ifc-root .col { display:flex; flex-direction:column; align-items:center; }
#ifc-root .col .card { flex:1; }
#ifc-root /* ---------- side panel ---------- */
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
#ifc-root .panel h3 { font-size:12.5px; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
#ifc-root #explain { font-size:13.5px; }
#ifc-root #explain code { background:#0c1220; padding:1px 5px; border-radius:4px; font-size:12px; color:var(--warn); }
#ifc-root #explain b.n { color:var(--ok); }
#ifc-root #explain b.m { color:var(--purple); }
#ifc-root #explain b.y { color:var(--warn); }
#ifc-root #explain p + p { margin-top:9px; }
#ifc-root .legend { margin-top:14px; padding-top:10px; border-top:1px solid var(--border); font-size:12px;
            color:var(--muted); display:flex; flex-direction:column; gap:5px; }
#ifc-root .lg { display:inline-block; width:30px; border-top:3px solid; margin-right:8px; vertical-align:middle; }
#ifc-root /* ---------- click-to-open code modal ---------- */
  .card { cursor:pointer; }
#ifc-root .card:hover { filter:brightness(1.15); }
#ifc-root .card::after { content:'view source'; position:absolute; top:10px; right:12px; font-size:9.5px;
                 color:var(--muted); letter-spacing:.8px; opacity:0; transition:opacity .2s; }
#ifc-root .card:hover::after { opacity:.9; }
#ifc-root .card .tag { margin-right:52px; }
@media (max-width:1080px){ #ifc-root .layout{ grid-template-columns:1fr; } }
</style>

<body>
<h1>Valkey Data Tiering &mdash; How It Works</h1>
<div class="sub">Interactive guide to Valkey Data Tiering internals. Explore the architecture, key state machine, read/write flows, storage engine, and pressure handling. Click components for source code.</div>

<div class="controls">
  <button id="b-overview" class="active" onclick="setView('overview')">Overview</button>
  <button id="b-states" onclick="setView('states')">Key state machine</button>
  <button id="b-spill" onclick="setView('spill')">Write path</button>
  <button id="b-fetch" onclick="setView('fetch')">Read path</button>
  <button id="b-fc" onclick="setView('fc')">FlashCache internals</button>
  <button id="b-ifaces" onclick="setView('ifaces')">Storage Interfaces</button>
  <button id="b-pressure" onclick="setView('pressure')">Under pressure</button>
  <div class="stepctl" id="stepctl" style="display:none">
    <button onclick="step(-1)">&larr;</button><span class="count" id="count"></span><button onclick="step(1)">&rarr;</button>
    <button onclick="play()" id="b-play">&#9654;</button>
  </div>
</div>

<div class="layout">
  <svg id="stage" viewBox="0 0 880 580">
    <defs>
      <marker id="arr"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#2a3550"/></marker>
      <marker id="arrB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#4da3ff"/></marker>
      <marker id="arrG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3ecf8e"/></marker>
    </defs>
    <g id="scene"></g>
  </svg>
  <div class="panel">
    <h3 id="p-title">Key state machine</h3>
    <div id="detail"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<template id="ifc-template">

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);

/* =========================================================================
   VIEW 1: STATE MACHINE (clickable, color-coded, edge labels in panel)
   Layout: two-row; Colors: green=resident, blue=on-disk, yellow=transient, red=edge-case
   ========================================================================= */
const STATES = {
  mem:   { x:440, y:60,  w:195, label:'ONLY_MEMORY', sub:'(0) value in RAM', color:'#0d4a2a', stroke:'#3ecf8e' },
  ctf:   { x:190, y:230, w:210, label:'COPYING_TO_FLASH', sub:'(1) spill in-flight', color:'#3a3510', stroke:'#f5b950' },
  ctm:   { x:690, y:230, w:225, label:'COPYING_TO_MEMORY', sub:'(3) fetch in-flight', color:'#3a3510', stroke:'#f5b950' },
  flash: { x:440, y:400, w:195, label:'ONLY_FLASH', sub:'(2) value on disk', color:'#122850', stroke:'#4da3ff' },
  pev:   { x:690, y:490, w:195, label:'PENDING_EVICT', sub:'(4) GC evicted from disk', color:'#3d1525', stroke:'#ff6b6b' },
  pdel:  { x:190, y:490, w:210, label:'PENDING_DELETION', sub:'(5) DEL mid-flight', color:'#3d1525', stroke:'#ff6b6b' },
};
const EDGES = [
  { from:'mem',   to:'ctf',   label:'spill selected (cold, LRU/LFU sampling)', short:'spill', bend:-30, lx:-60, ly:-4 },
  { from:'ctf',   to:'flash', label:'write completion OK: release RAM value, encoding=TIERED', short:'write OK', bend:-30 },
  { from:'ctf',   to:'mem',   label:'write failed/rejected: value stays in RAM, retry later', short:'write fail', bend:50 },
  { from:'flash', to:'ctm',   label:'command touches key: async fetch submitted', short:'fetch', bend:-30 },
  { from:'ctm',   to:'mem',   label:'read completion OK: value re-attached to entry', short:'read OK', bend:-30 },
  { from:'ctm',   to:'pev',   label:'FlashCache GC evicts item from disk while fetch is in-flight', short:'GC evict', bend:0 },
  { from:'pev',   to:'flash', label:'IO done: GC already reclaimed the flash copy; entry removed from keyspace', short:'entry removed', bend:-25 },
  { from:'flash', to:'pdel',  label:'client DEL: delete flash copy first', short:'DEL', bend:-25 },
  { from:'pdel',  to:'mem',   label:'delete OK: entry retained, DEL re-executes with full semantics', short:'del OK', bend:-120 },
];
const STATE_DETAIL = {
  mem: {
    t: 'ONLY_MEMORY (0)',
    summary: 'The default state. Value lives in RAM. Keys in this state are <b>not tracked</b> in any tiering structure -- the state is implicit (0 in the 3-bit field). This is why memory-resident keys pay only a header-bits check: if the bits are 0, the command proceeds with zero additional cost.',
    commands: '<tr><th>GET</th><td class="ok">normal execution</td></tr><tr><th>SET</th><td class="ok">normal execution</td></tr><tr><th>DEL</th><td class="ok">normal execution</td></tr>',
    code: `<span class="cm">// ext_storage.h</span>
<span class="kw">typedef enum</span> {
    TIERING_STATE_ONLY_MEMORY = <span class="hl">0</span>,  <span class="cm">/* not in HT */</span>
    ...
} <span class="ty">TieringState</span>;

<span class="cm">// State 0 = not in the tiering hashtable.</span>
<span class="cm">// Never reached in the KBC switch -- the</span>
<span class="cm">// key simply isn't found in the state HT.</span>`
  },
  ctf: {
    t: 'COPYING_TO_FLASH (1)',
    summary: 'An async write (spill) to storage is in-flight. The value is <b>still in RAM</b> -- nothing is lost if the write fails. Reads can proceed normally since the value is still accessible in memory. Writes must block because mutating a value while it is being serialized on the IO thread would corrupt the serialized output.',
    commands: '<tr><th>GET</th><td class="ok">served from RAM (value still there)</td></tr><tr><th>SET</th><td class="hot">BLOCK until spill completes</td></tr><tr><th>DEL</th><td class="hot">BLOCK until spill completes</td></tr>',
    code: `<span class="cm">// ext_storage.c:466</span>
<span class="kw">case</span> TIERING_STATE_COPYING_TO_FLASH:
    <span class="kw">if</span> (is_write_cmd) {
        kbc_spilling_block_count++;
        <span class="kw">return</span> 1;  <span class="cm">/* BLOCK */</span>
    }
    <span class="cm">/* GET: value still in RAM */</span>
    dram_value_hits++;
    <span class="kw">return</span> 0;  <span class="cm">/* allow */</span>`
  },
  flash: {
    t: 'ONLY_FLASH (2)',
    summary: 'The value lives on storage. In RAM: key, expiry, and a stub object with <code>encoding=TIERED</code>. This is the state that saves memory. Any command that needs the value triggers an async fetch; DEL triggers an async delete-on-flash. TTL expiry still works: expired flash keys are caught by lazy expiry (on access) and active expiry (periodic sampling).',
    commands: '<tr><th>GET</th><td class="wa">triggers async fetch + blocks client</td></tr><tr><th>SET</th><td class="wa">triggers async fetch + blocks client</td></tr><tr><th>DEL</th><td class="wa">triggers async delete-on-flash</td></tr>',
    code: `<span class="cm">// ext_storage.c:508</span>
<span class="kw">case</span> TIERING_STATE_ONLY_FLASH:
    <span class="kw">if</span> (is_delete_cmd) {
        extStorageBridge_submitDel(db_id, key);
        extStorageSetState(db, key,
            <span class="hl">TIERING_STATE_PENDING_DELETION</span>, 1);
    } <span class="kw">else</span> {
        extStorageBridge_submitGet(db_id, key);
        extStorageSetState(db, key,
            <span class="hl">TIERING_STATE_COPYING_TO_MEMORY</span>, 1);
    }
    <span class="kw">return</span> 1;  <span class="cm">/* BLOCK client */</span>`
  },
  ctm: {
    t: 'COPYING_TO_MEMORY (3)',
    summary: 'An async read from flash is in-flight. The client that triggered the fetch is blocked; the event loop keeps serving everyone else. Additional commands on the same key join the waiters. A transient backend rejection (read queue full) returns <code>READ_RETRY</code> -- the fetch is re-issued, NOT treated as a miss.',
    commands: '<tr><th>GET</th><td class="hot">BLOCK (join waiters on this key)</td></tr><tr><th>SET</th><td class="hot">BLOCK</td></tr><tr><th>DEL</th><td class="hot">BLOCK</td></tr>',
    code: `<span class="cm">// ext_storage.c:487</span>
<span class="kw">case</span> TIERING_STATE_COPYING_TO_MEMORY:
    kbc_fetching_block_count++;
    <span class="kw">return</span> 1;

<span class="cm">// on READ_RETRY completion:</span>
<span class="kw">if</span> (status == <span class="hl">READ_RETRY</span>) {
    extStorageBridge_submitGet(db_id, key);
    <span class="cm">/* re-issue, don't treat as miss */</span>
}`
  },
  pev: {
    t: 'PENDING_EVICT (4)',
    summary: 'A client touched a flash-resident key, triggering a fetch (COPYING_TO_MEMORY). While that fetch is in-flight, FlashCache\'s GC autonomously evicts the same item from disk to reclaim NVMe space. The engine can\'t act on the GC notification yet (IO thread holds references), so it marks the key PENDING_EVICT. When the fetch completes, the completion handler sees PENDING_EVICT and removes the entry from the keyspace -- the flash copy is already gone. <b>This is NOT memory eviction by the engine. This is the engine reconciling after the storage backend\'s GC reclaimed the item from disk.</b>',
    commands: '<tr><th>GET</th><td class="hot">BLOCK (wait for fetch to finish)</td></tr><tr><th>SET</th><td class="hot">BLOCK</td></tr><tr><th>DEL</th><td class="hot">BLOCK</td></tr>',
    code: `<span class="cm">// ext_storage.c:1256 -- GC DELETE arrives</span>
<span class="cm">// while a fetch is in-flight:</span>
<span class="kw">case</span> TIERING_STATE_COPYING_TO_MEMORY:
    <span class="cm">/* Fetch in-flight, GC wants the item.</span>
<span class="cm">       Mark for cleanup on completion. */</span>
    extStorageSetState(db, key,
        <span class="hl">TIERING_STATE_PENDING_EVICT</span>, 0);

<span class="cm">// ext_storage.c:1006 -- fetch completes:</span>
<span class="cm">/* GC already reclaimed it. No client is</span>
<span class="cm">   waiting for a reply -- remove entry. */</span>
<span class="fn">dbDelete</span>(db, &keyobj);

<span class="cm">// KBC (ext_storage.c:494)</span>
<span class="kw">case</span> TIERING_STATE_PENDING_EVICT:
    <span class="kw">return</span> 1;  <span class="cm">/* BLOCK all */</span>`
  },
  pdel: {
    t: 'PENDING_DELETION (5)',
    summary: 'A client ran DEL on a flash-resident key. The flash copy is deleted via async IO. When the delete completes, the engine does NOT remove the entry from the hashtable. Instead it marks it PENDING_DELETION and unblocks the client. The client\'s DEL command <b>re-executes through the normal path</b> and finds the entry, so it fires all command-layer side effects (WATCH invalidation, keyspace notification, replication propagation, dirty++). The entry has no real value (both DRAM and flash copies are gone) -- PENDING_DELETION exists solely to keep the metadata alive long enough for the DEL to run with full semantics.',
    commands: '<tr><th>DEL</th><td class="ok">allowed through (the re-execute)</td></tr><tr><th>GET</th><td class="hot">BLOCK (wait for DEL to drain)</td></tr><tr><th>SET</th><td class="hot">BLOCK</td></tr>',
    code: `<span class="cm">// ext_storage.c:999 -- delete completion</span>
<span class="cm">/* Do NOT remove entry. Client's DEL must</span>
<span class="cm">   find it for full side effects. */</span>
extStorageSetState(db, key_name,
    <span class="hl">TIERING_STATE_PENDING_DELETION</span>, 0);

<span class="cm">// KBC (ext_storage.c:506)</span>
<span class="kw">if</span> (is_delete_cmd) <span class="kw">return</span> 0; <span class="cm">/* allow */</span>
<span class="cm">/* everything else blocks */</span>

<span class="cm">// Client's DEL re-runs normally:</span>
<span class="cm">// dbDelete() -> signalModifiedKey()</span>
<span class="cm">//   + notifyKeyspaceEvent("del")</span>
<span class="cm">//   + server.dirty++</span>`
  },
};

function borderPoint(s, toward) {
  const dx = toward.x - s.x, dy = toward.y - s.y;
  const hw = s.w/2 + 6, hh = 26 + 6;
  const sx = dx !== 0 ? hw / Math.abs(dx) : Infinity;
  const sy = dy !== 0 ? hh / Math.abs(dy) : Infinity;
  const t = Math.min(sx, sy);
  return { x: s.x + dx*t, y: s.y + dy*t };
}
function drawStates() {
  const g = $('scene'); g.innerHTML = '';
  EDGES.forEach((e, i) => {
    const A = STATES[e.from], B = STATES[e.to];
    const mid = { x:(A.x+B.x)/2, y:(A.y+B.y)/2 };
    const dx = B.x-A.x, dy = B.y-A.y, len = Math.hypot(dx,dy) || 1;
    const cp = { x: mid.x + (-dy/len)*e.bend, y: mid.y + (dx/len)*e.bend };
    const p1 = borderPoint(A, cp), p2 = borderPoint(B, cp);
    e._el = el('path', { d:`M ${p1.x} ${p1.y} Q ${cp.x} ${cp.y} ${p2.x} ${p2.y}`, class:'edge', id:'e'+i }, g);
    const pt = e._el.getPointAtLength(e._el.getTotalLength() * 0.5);
    e._lb = el('text', { x:pt.x+(e.lx||6), y:pt.y+(e.ly||-8), class:'elabel' }, g, e.short);
  });
  Object.entries(STATES).forEach(([id, s]) => {
    s._el = el('rect', { x:s.x-s.w/2, y:s.y-26, width:s.w, height:52, class:'node', id:'n-'+id, fill:s.color, stroke:s.stroke, 'stroke-width':'2.5' }, g);
    el('text', { x:s.x, y:s.y-3, 'text-anchor':'middle', class:'nlabel' }, g, s.label);
    el('text', { x:s.x, y:s.y+14, 'text-anchor':'middle', class:'nsub' }, g, s.sub);
    s._el.addEventListener('click', () => selectState(id));
  });
}
function selectState(id) {
  Object.entries(STATES).forEach(([k, s]) => { s._el.classList.toggle('sel', k === id); });
  EDGES.forEach(e => {
    const out = e.from === id, inn = e.to === id;
    e._el.classList.toggle('hi', out); e._el.classList.toggle('hi-in', inn);
    e._el.classList.toggle('dim', !out && !inn);
    if (e._lb) {
      e._lb.classList.toggle('hi', out); e._lb.classList.toggle('hi-in', inn);
      e._lb.classList.toggle('dim', !out && !inn);
    }
  });
  const d = STATE_DETAIL[id];
  const transitions = EDGES.filter(e => e.from === id || e.to === id)
    .map(e => `<li><span style="color:${e.from===id?'var(--accent)':'var(--ok)'}">${e.from===id?'OUT':'IN'}</span> ${e.label}</li>`).join('');
  $('p-title').textContent = d.t;
  $('detail').innerHTML =
      `<p style="font-weight:700;font-size:11.5px;color:var(--muted);margin-bottom:4px">SUMMARY</p>`
    + `<p>${d.summary}</p>`
    + `<p style="font-weight:700;font-size:11.5px;color:var(--muted);margin-top:12px;margin-bottom:4px">COMMAND BEHAVIOR</p>`
    + `<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tbody>${d.commands}</tbody></table>`
    + `<p style="font-weight:700;font-size:11.5px;color:var(--muted);margin-top:12px;margin-bottom:4px">TRANSITIONS</p>`
    + `<ul style="font-size:12.5px;margin:4px 0 0 16px;color:var(--muted)">${transitions}</ul>`
    + `<p style="font-weight:700;font-size:11.5px;color:var(--muted);margin-top:12px;margin-bottom:4px">CODE</p>`
    + `<div style="background:#0c1220;border:1px solid var(--border);border-radius:8px;padding:10px;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#c9d6ee;overflow-x:auto">${d.code}</div>`;
  $('hint').textContent = 'Click another state, or switch to a flow view above.';
}


/* =========================================================================
   VIEWS 2-4: STEP-THROUGH FLOWS (pipeline stages + state chip / gauge)
   ========================================================================= */
function drawPipeline(stages, chipText) {
  const g = $('scene'); g.innerHTML = '';
  const W = 300, X = 260;
  const gap = Math.min(88, Math.floor(500 / stages.length));
  const H = Math.min(64, gap - 14);
  stages.forEach((s, i) => {
    const y = 26 + i*gap;
    if (i > 0) el('path', { d:`M ${X+W/2} ${y-gap+H} L ${X+W/2} ${y}`, class:'edge' }, g);
    s._el = el('rect', { x:X, y, width:W, height:H, class:'stage'+(s.io?' io':''), rx:10, style:'cursor:pointer' }, g);
    if (s.code) { const _s = s; s._el.addEventListener('click', () => openModal(_s.name, _s.code, _s.file || '')); }
    el('text', { x:X+W/2, y:y+H/2-4, 'text-anchor':'middle', class:'slabel' }, g, s.name);
    el('text', { x:X+W/2, y:y+H/2+13, 'text-anchor':'middle', class:'ssub' }, g, s.sub);
  });
  el('rect', { x:600, y:26, width:266, height:44, class:'chip', id:'chip' }, g);
  el('text', { x:733, y:53, 'text-anchor':'middle', class:'chiptext', id:'chiptext' }, g, chipText);
  el('text', { x:733, y:16, 'text-anchor':'middle', class:'nsub' }, g, 'KEY STATE');
}
/* FlashCache internals scene */
const FC = {};
function drawFC() {
  const g = $('scene'); g.innerHTML = '';
  Object.keys(FC).forEach(k => delete FC[k]);

  } else {

    document.querySelector('.panel').style.display = '';
    document.querySelector('.layout').classList.remove('full-width');
    $('stepctl').style.display = 'flex';
    const f = FLOWS[v];
    if (v === 'spill' || v === 'fetch' || v === 'fc') {
      hidePipelineHTML();

    } else {
      hidePipelineHTML();

function updateCount() {
  const f = FLOWS[view];
  $('count').textContent = f ? (idx+1) + ' / ' + f.steps.length : '';
}
function step(d) {
  if (view === 'states') return;
  const f = FLOWS[view];
  idx = Math.max(-1, Math.min(f.steps.length-1, idx+d));
  if (idx < 0) { setView(view); return; }
  const s = f.steps[idx];
  if (view === 'spill' || view === 'fetch' || view === 'fc') {
    pipelineStep(f, idx);
  } else if (f.gauge) { gaugeMark(s.frac); }
  else if (f.custom === 'fc') { fcLight(s.lit); }
  else {
    f.stages.forEach((st, i) => st._el.classList.toggle('lit', s.lit.includes(i)));
    $('chiptext').textContent = s.chip;
  }
  $('detail').innerHTML = s.cap;
  updateCount();
}
function play() {
  if (timer) { clearInterval(timer); timer = null; $('b-play').innerHTML = '&#9654;'; return; }
  if (view === 'states') setView('spill');
  $('b-play').innerHTML = '&#10074;&#10074;';
  step(1);
  timer = setInterval(() => {
    const f = FLOWS[view];
    if (idx >= f.steps.length-1) {
      const order = ['spill','fetch','fc','pressure'];
      const i = order.indexOf(view);
      if (i >= 0 && i < order.length-1) { setView(order[i+1]); step(1); }
      else { clearInterval(timer); timer = null; $('b-play').innerHTML = '&#9654;'; }
    } else step(1);
  }, 4200);
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

const IFC_VIEWS = {
both: { dim: [], title: 'Both paths', ex: `
  <p>Follow one write down the stack: <b>tiering logic</b> calls <code>extStorageBridge_submitPut(key_robj, value_robj)</code> &rarr; the <b>bridge</b> forwards to <code>storageSubmitPut()</code> &rarr; <b>dispatch</b> resolves <code>server_storage-&gt;put_async(...)</code> &rarr; lands in whichever provider filled the <b class="y">storageType</b> struct.</p>
  <p><b class="n">Native</b>: the struct is defined statically in the backend file, compiled in, chosen by <code>ext-storage-backend</code>.</p>
  <p><b class="m">Module</b>: the identical struct layout, handed over once at load time. A registered module backend takes priority over the config.</p>
  <p><i>Click any box to see its exact source.</i></p>` },

native: { dim: ['c-modapi','c-module','k-reg','k-mod'], title: 'Native path', ex: `
  <p>The backend defines <code>static storageType fc_type = { .put_async = fc_put, ... }</code>. At startup the bridge matches the config name and stores the pointer.</p>
  <p>From then on: <code>storageSubmitPut()</code> &rarr; <code>type-&gt;put_async(...)</code> &mdash; a plain function-pointer call into compiled-in code.</p>
  <p>Serialization needs no handoff: same address space, the IO thread calls the engine's callbacks directly.</p>` },

module: { dim: ['c-native','k-native'], title: 'Module path', ex: `
  <p>The module API has exactly <b class="m">two jobs, both at load time</b>:</p>
  <p><b class="m">UP</b> &mdash; <code>RegisterStorageBackend(ctx, &amp;struct)</code>: carries the module's struct to the engine. It lands in the same slot a native struct would occupy.</p>
  <p><b class="m">DOWN</b> &mdash; <code>GetExternalStorageSerializationCallbacks(...)</code>: hands the engine's robj*&harr;bytes functions to the module, so serialization still runs on the module's IO worker, never the main thread.</p>
  <p>After these two calls, the module API's work is done.</p>` },

runtime: { dim: ['c-modapi','k-reg','k-mod','k-native'], title: 'Call time &mdash; the punchline', ex: `
  <p>At runtime, <b class="m">the module API is not on the path at all</b> (dimmed). Both providers are reached identically:</p>
  <p><code>storageSubmitPut()</code> &rarr; <code>type-&gt;put_async(...)</code> &rarr; <code>fc_put</code> <i>or</i> <code>nks_put_async</code>.</p>
  <p><b>Zero per-call overhead difference.</b> No message queue, no translation layer &mdash; the registration API moved a pointer once; it never moves data.</p>
  <p>This is why a module-provided backend benchmarks the same as a native one, and why the registration API could stay tiny.</p>` },
};
function ifcSetView(v) {
  document.querySelectorAll('#ifc-root .controls button').forEach(b => b.classList.remove('active'));
  $('b-' + v).classList.add('active');
  IFC_PARTS.forEach(id => $(id).classList.toggle('dimmed', IFC_VIEWS[v].dim.includes(id)));
  $('v-title').innerHTML = IFC_VIEWS[v].title;
  $('explain').innerHTML = IFC_VIEWS[v].ex;
}
function ifcInit() {
  ['c-engine','c-bridge','c-dispatch','c-contract','c-native','c-modapi','c-module'].forEach(id =>
    $(id).addEventListener('click', () => { const c = IFC_CODE[id]; openModal(c.t, c.c, c.f); }));
  ifcSetView('both');
}
