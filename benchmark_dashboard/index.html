<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valkey Data Tiering — Benchmark Dashboard</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0 }
    body { font-family:system-ui,sans-serif; background:#1a1a2e; color:#e4e4e4; height:100vh; display:flex; flex-direction:column; overflow:hidden }
    .navbar { display:flex; align-items:center; gap:1rem; padding:.5rem 1.5rem; background:#0d1117; border-bottom:1px solid #0f3460; flex-shrink:0; z-index:100 }
    .navbar .title { font-size:.85rem; font-weight:600; color:#e4e4e4 }
    .navbar .title span { color:#0ea5e9 }
    .navbar select { background:#16213e; color:#e4e4e4; border:1px solid #0f3460; padding:.35rem .7rem; border-radius:4px; font-size:.8rem; cursor:pointer }
    .navbar select:hover { border-color:#0ea5e9 }
    .navbar .status { font-size:.7rem; color:#a0a0b0; margin-left:auto }
    .navbar .status.loading { color:#f97316 }
    .navbar .status.error { color:#ef4444 }
    .navbar .status.ok { color:#10b981 }
    #view-frame { flex:1; border:none; width:100%; background:#1a1a2e }
    .error-box { flex:1; display:flex; align-items:center; justify-content:center; color:#a0a0b0; flex-direction:column; gap:.5rem }
    .error-box a { color:#0ea5e9 }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="title"><span>Valkey</span> Data Tiering Benchmarks</div>
    <label style="font-size:.75rem;color:#a0a0b0">Branch:</label>
    <select id="branch-select">
      <option value="unstable">unstable</option>
      <option value="policies">policies</option>
    </select>
    <span class="status" id="status"></span>
  </nav>

  <iframe id="view-frame"></iframe>

<script>
const OWNER = 'dubey02';
const REPO = 'valkey-data-tiering';
const VIEW_PATH = 'benchmark_dashboard/view.html';

function rawUrl(branch) {
  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${branch}/${VIEW_PATH}`;
}

const branchSelect = document.getElementById('branch-select');
const frame = document.getElementById('view-frame');
const status = document.getElementById('status');

async function loadBranch(branch) {
  status.textContent = 'Loading...';
  status.className = 'status loading';

  try {
    const resp = await fetch(rawUrl(branch));
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — branch may not have view.html yet`);
    const html = await resp.text();
    frame.srcdoc = html;
    status.textContent = branch;
    status.className = 'status ok';
  } catch (e) {
    status.textContent = `Error: ${e.message}`;
    status.className = 'status error';
  }

  // Update URL without reload
  const url = new URL(window.location);
  url.searchParams.set('branch', branch);
  history.replaceState(null, '', url);
}

branchSelect.onchange = () => loadBranch(branchSelect.value);

// Receive data-loading status from the embedded view
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'view-status') {
    status.textContent = e.data.text;
    status.className = 'status ' + (e.data.cls || '');
  }
});

// Init from URL param or default to unstable
const params = new URLSearchParams(window.location.search);
const initBranch = params.get('branch') || 'unstable';
if (![...branchSelect.options].some(o => o.value === initBranch)) {
  branchSelect.add(new Option(initBranch, initBranch));
}
branchSelect.value = initBranch;
loadBranch(branchSelect.value);
</script>
</body>
</html>
